<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="40%" stop-color="#ff7e40" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.01" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #f59e0b;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #f8fafc;
    }

    /* Ambient Pulsing Glow */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.15); }
    }
    .glow-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .glow-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }

    /* Dynamic Wave Flow Animation */
    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-600px); }
    }
    .wave-line {
      animation: waveMove 14s linear infinite;
    }
    .wave-line-fast {
      animation: waveMove 9s linear infinite;
    }

    /* Lightning Flash Animation */
    @keyframes flashPulse {
      0%, 90%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #f59e0b); }
      93% { opacity: 1; filter: drop-shadow(0 0 20px #fbbf24); }
      96% { opacity: 0.7; }
    }
    .flash-bolt {
      animation: flashPulse 4s ease-in-out infinite;
    }

    /* Floating Pill Animations */
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 4.6s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill3 5.2s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPill1 4.2s ease-in-out infinite 1.5s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Perspective Grid -->
  <g stroke="url(#gridGrad)" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <!-- Vertical Grid -->
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Glowing Background Orbs (Behind Foreground) -->
  <circle cx="200" cy="120" r="140" fill="#f43f5e" opacity="0.18" filter="url(#glow)" class="glow-orb-1" />
  <circle cx="1020" cy="280" r="160" fill="#8b5cf6" opacity="0.22" filter="url(#glow)" class="glow-orb-2" />
  <circle cx="620" cy="80" r="100" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Wave Flows in Background -->
  <g opacity="0.45">
    <path class="wave-line" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8 8"
          d="M-600,320 C-300,280 -100,360 200,310 C500,260 700,360 1000,310 C1300,260 1500,360 1800,310" />
    <path class="wave-line-fast" fill="none" stroke="#38bdf8" stroke-width="2"
          d="M-600,345 C-350,390 -50,300 250,350 C550,400 850,300 1150,350 C1450,400 1750,300 2050,350" />
  </g>

  <!-- High-Tech Border Container Frame -->
  <rect x="25" y="25" width="1150" height="350" rx="20" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.7" />
  <rect x="35" y="35" width="1130" height="330" rx="14" fill="#0f172a" fill-opacity="0.3" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 45 65 L 45 45 L 65 45" stroke="#f59e0b" stroke-width="3" fill="none" />
  <path d="M 1155 65 L 1155 45 L 1135 45" stroke="#f59e0b" stroke-width="3" fill="none" />
  <path d="M 45 335 L 45 355 L 65 355" stroke="#f43f5e" stroke-width="3" fill="none" />
  <path d="M 1155 335 L 1155 355 L 1135 355" stroke="#8b5cf6" stroke-width="3" fill="none" />

  <!-- Dynamic Animated Feature Pills in Foreground (Above waves, cleanly styled) -->
  <g class="pill-1" transform="translate(140, 290)">
    <rect width="180" height="40" rx="20" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="22" cy="20" r="6" fill="#ef4444" />
    <text x="36" y="25" class="badge-pill-text">⚡ Zero Overselling</text>
  </g>

  <g class="pill-2" transform="translate(350, 290)">
    <rect width="210" height="40" rx="20" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="22" cy="20" r="6" fill="#f59e0b" />
    <text x="36" y="25" class="badge-pill-text">⏱️ Scheduled Drops</text>
  </g>

  <g class="pill-3" transform="translate(590, 290)">
    <rect width="230" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="22" cy="20" r="6" fill="#38bdf8" />
    <text x="36" y="25" class="badge-pill-text">🚀 35,000+ Req/s Enqueue</text>
  </g>

  <g class="pill-4" transform="translate(850, 290)">
    <rect width="210" height="40" rx="20" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="22" cy="20" r="6" fill="#a855f7" />
    <text x="36" y="25" class="badge-pill-text">🛡️ Bot Throttling & Queue</text>
  </g>

  <!-- Dynamic Lightning Bolt Icon (Animated Glow) -->
  <g class="flash-bolt" transform="translate(100, 105) scale(1.15)">
    <polygon points="40,0 15,48 35,48 10,95 65,40 42,40" fill="url(#primaryTextGrad)" />
  </g>

  <!-- Foreground Typography (Highest Z-Index Layer) -->
  <g transform="translate(200, 115)">
    <!-- Small Category Label -->
    <text x="0" y="5" class="tagline-text">High-Concurrency Drop &amp; Inventory Infrastructure</text>

    <!-- Main Title -->
    <text x="0" y="65" class="title-text" fill="url(#primaryTextGrad)" filter="url(#softGlow)">
      Awesome Flash Sale Automation
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle-text">
      Curated ecosystem of SaaS platforms &amp; open-source engines for extreme-traffic drops
    </text>
  </g>
</svg>
